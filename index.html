<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris Apex</title>
  </head>
  <body>
    <div class="app">
      <header class="chrome">
        <h1>Tetris Apex</h1>
        <p class="tagline">Phase 2 — SRS, Hold, Next, Ghost, DAS/ARR</p>
      </header>

      <div class="stage">
        <aside class="hud-slot hud-left">
          <div class="hud-card">
            <span class="hud-label">Hold</span>
            <canvas id="hold" class="mini-well" width="96" height="80" aria-label="Hold"></canvas>
          </div>
          <div class="hud-card hud-card-compact">
            <span class="hud-label">Linien</span>
            <span id="hud-lines" class="hud-value">0</span>
          </div>
        </aside>

        <div class="well-wrap">
          <canvas id="board" width="320" height="640" aria-label="Tetris-Feld"></canvas>
          <div id="overlay" class="overlay hidden" role="dialog" aria-labelledby="overlay-title">
            <div class="overlay-card">
              <h2 id="overlay-title">Game Over</h2>
              <p>Linien: <span id="overlay-lines">0</span></p>
              <button type="button" id="restart">Neu starten</button>
              <p class="overlay-hint">oder R drücken</p>
            </div>
          </div>
        </div>

        <aside class="hud-slot hud-right">
          <div class="hud-card hud-card-next">
            <span class="hud-label">Next</span>
            <div class="next-list">
              <canvas class="mini-well next-piece" width="96" height="56" aria-hidden="true"></canvas>
              <canvas class="mini-well next-piece" width="96" height="56" aria-hidden="true"></canvas>
              <canvas class="mini-well next-piece" width="96" height="56" aria-hidden="true"></canvas>
              <canvas class="mini-well next-piece" width="96" height="56" aria-hidden="true"></canvas>
              <canvas class="mini-well next-piece" width="96" height="56" aria-hidden="true"></canvas>
            </div>
          </div>
        </aside>
      </div>

      <p class="controls">
        <kbd>←</kbd> <kbd>→</kbd> DAS/ARR ·
        <kbd>↓</kbd> Soft Drop ·
        <kbd>↑</kbd> / <kbd>X</kbd> CW ·
        <kbd>Z</kbd> / <kbd>Ctrl</kbd> CCW ·
        <kbd>A</kbd> 180 ·
        <kbd>Leertaste</kbd> Hard Drop ·
        <kbd>C</kbd> / <kbd>Shift</kbd> Hold ·
        <kbd>R</kbd> Neustart
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
